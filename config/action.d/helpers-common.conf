[DEFAULT]

# Usage:
#   _grep_logs_args = 'test'
#   (printf %%b "Log-excerpt contains 'test':\n"; %(_grep_logs)s; printf %%b "Log-excerpt contains 'test':\n") | mail ...
#
_grep_logs = logpath="<logpath>"; grep <grepopts> %(_grep_logs_args)s $logpath | <greplimit>
# IPv4 and non-IP identifiers retain fixed-string matching.
_grep_logs_args = <grepflags> "<grepip>"

# Used for actions, that should not by executed if ticket was restored:
_bypass_if_restored = if [ '<restored>' = '1' ]; then exit 0; fi;

[Init]
greplimit = tail -n <grepmax>
grepmax = 1000
grepopts = -m <grepmax>

grepflags = -wF
grepip = <ip>

[Init?family=inet6]
grepflags = -iE
# Colons are part of the address, not word boundaries. Also allow the
# "IPv6:" prefix used by sendmail without matching a suffix of another IP.
grepip = (^|[^[:alnum:]_:.]|IPv6:)<ip-regex>($|[^[:alnum:]_:.])
