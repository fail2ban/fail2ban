# Fail2Ban filter for failed HTTP authentication in Traefik access logs.
#
# Author: CrazyMax
#
# Configure Traefik to write access logs to a file readable by Fail2Ban and
# set the jail's logpath to that file (here /var/log/traefik/access.log).
# https://doc.traefik.io/traefik/observe/logs-and-access-logs/
#
# The default filter reads common-format logs. For JSON logs, change
# --accesslog.format to json and set filter = traefik-auth[logtype=json]
# in jail.local. Keep the required JSON fields listed below.
#
# Docker Compose example for Traefik v3 with a BasicAuth-protected dashboard:
# https://doc.traefik.io/traefik/v3.6/reference/install-configuration/api-dashboard/
# Replace the example hostname and test:test credentials, and configure a TLS
# certificate for your deployment (otherwise Traefik uses its default certificate).
# Access the dashboard at https://traefik.example.com/dashboard/.
#
# services:
#   traefik:
#     image: traefik:v3.6
#     command:
#       - "--accesslog=true"
#       - "--accesslog.filepath=/var/log/traefik/access.log"
#       - "--accesslog.format=common"
#       - "--accesslog.addinternals=true"
#       - "--entrypoints.websecure.address=:443"
#       - "--providers.docker=true"
#       - "--providers.docker.exposedbydefault=false"
#       - "--api.dashboard=true"
#     ports:
#       - "443:443"
#     labels:
#       - "traefik.enable=true"
#       - "traefik.http.routers.dashboard.rule=Host(`traefik.example.com`)"
#       - "traefik.http.routers.dashboard.entrypoints=websecure"
#       - "traefik.http.routers.dashboard.tls=true"
#       - "traefik.http.routers.dashboard.service=api@internal"
#       - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
#       - "traefik.http.middlewares.dashboard-auth.basicauth.users=test:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/"
#     volumes:
#       - "/var/log/traefik:/var/log/traefik"
#       - "/var/run/docker.sock:/var/run/docker.sock:ro"
#     restart: unless-stopped
#

[Definition]

# Parameter "method" can be used to specify request method
req-method = \S+
# Usage example (for jail.local):
#   filter = traefik-auth[req-method="GET|POST|HEAD"]

# Log format: common (default) or json (--accesslog.format=json).
# JSON logs must retain ClientHost, ClientUsername, DownstreamStatus,
# RequestMethod and StartUTC. For example:
#   filter = traefik-auth[logtype=json]
logtype = common

failregex = <lt_<logtype>/failregex>
datepattern = <lt_<logtype>/datepattern>

ignoreregex =

# Parameter "mode": normal (default), ddos or aggressive
# Usage example (for jail.local):
#   [traefik-auth]
#   mode = aggressive
#   # or another jail (rewrite filter parameters of jail):
#   [traefik-auth-ddos]
#   filter = traefik-auth[mode=ddos]
#
mode = normal

# part of failregex matches user name (must be available in normal mode, must be empty in ddos mode, and both for aggressive mode):
usrre-normal = (?!- )<F-USER>\S+</F-USER>
usrre-ddos = -
usrre-aggressive = <F-USER>\S+</F-USER>

[lt_common]

failregex = ^<HOST> \- <usrre-<mode>> \[\] \"(?:<req-method>) [^\"]+\" 401\b
datepattern = {DEFAULT}

[lt_json]

# Consume complete JSON fields, including escaped strings, so request data
# cannot masquerade as a field. Traefik access-log fields are scalar values.
_string = "(?:[^"\\]|\\.)*"
_value = (?:%(_string)s|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null)
_fields = (?:\s*%(_string)s\s*:\s*%(_value)s\s*,)*\s*

usrre-normal = (?!-")<F-USER>(?:[^"\\]|\\.)+</F-USER>
usrre-ddos = -?
usrre-aggressive = <F-USER>(?:[^"\\]|\\.)*</F-USER>

failregex = ^\{(?=%(_fields)s"DownstreamStatus"\s*:\s*401\s*[,}])(?=%(_fields)s"ClientUsername"\s*:\s*"<lt_json/usrre-<mode>>"\s*[,}])(?=%(_fields)s"RequestMethod"\s*:\s*"(?:<req-method>)"\s*[,}])%(_fields)s"ClientHost"\s*:\s*"<ADDR>"\s*[,}]

datepattern = ^\{%(_fields)s"StartUTC"\s*:\s*"(%%ExY-%%m-%%dT%%H:%%M:%%S(?:\.%%f\d{0,3})?%%z)"
