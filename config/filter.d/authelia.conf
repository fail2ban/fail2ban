# Fail2Ban filter for Authelia
#
# Detecting unauthorized access to Authelia authentication portal
# (https://github.com/authelia/authelia)
#
# Supports two logging formats via logtype option:
#   logtype = file  (default, standard key-value text format)
#   logtype = json  (structured JSON format)
#

[INCLUDES]

# Load customizations if any available
after = authelia.local

[Definition]

# Log format: "file" (standard key-value text) or "json"
logtype = file

failregex = <lt_<logtype>/failregex>
datepattern = <lt_<logtype>/datepattern>
ignoreregex =

journalmatch = _SYSTEMD_UNIT=authelia.service

[lt_file]

datepattern = {^LN-BEG}time="{DATE}"\s+
grp = (?:\w+=("(?:[^\\"]|\\.)*"|\S+)\s+)*
failregex = ^\s*%(grp)smsg="Unsuccessful \S+ authentication attempt by user '<F-USER>(?:[^\\']|\\.)*</F-USER>'[^"]*" %(grp)sremote_ip=<ADDR>

[lt_json]

datepattern = "time":"{DATE}"
grp = (?:"\w+":("(?:[^\\"]|\\.)*"|\S+),\s*)*
failregex = ^{%(grp)s"msg":"Unsuccessful \S+ authentication attempt by user '<F-USER>(?:[^\\']|\\.)*</F-USER>'[^"]*",%(grp)s"remote_ip":"<ADDR>"
            ^{%(grp)s"remote_ip":"<ADDR>",%(grp)s"msg":"Unsuccessful \S+ authentication attempt by user '<F-USER>(?:[^\\']|\\.)*</F-USER>'[^"]*"
