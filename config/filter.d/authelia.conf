# Fail2Ban filter for Authelia
#
# Detecting unauthorized access to Authelia authentication portal
# (https://github.com/authelia/authelia)
#
# Supports logging formats via logtype option:
#   logtype = file     (default, standard key-value text format)
#   logtype = journal  (systemd-journal key-value text format)
#   logtype = json     (structured JSON format, also with optional journal prefix)
#

[INCLUDES]

before = common.conf

[Definition]

_daemon = authelia

failregex = <lt_<logtype>/failregex>
datepattern = <lt_<logtype>/datepattern>
ignoreregex =

journalmatch = _SYSTEMD_UNIT=authelia.service

[lt_file]

__prefix_line = \s*
datepattern = {^LN-BEG}time="{DATE}"\s+
grp = (?:(?!msg|remote_ip)\w+=("(?:[^\\"]|\\.)*"|\S+)\s+)*
failregex = ^<__prefix_line>%(grp)smsg="Unsuccessful \S+ authentication attempt by user '<F-USER>(?:[^\\']|\\.)*</F-USER>'[^"]*" %(grp)sremote_ip=<ADDR>

[lt_short]

datepattern = {^LN-BEG}
failregex = <lt_file/failregex>

[lt_journal]

datepattern = {^LN-BEG}
failregex = <lt_file/failregex>

[lt_json]

datepattern = {^LN-BEG}
              "time":"{DATE}"
grp = (?:"(?!msg|remote_ip)\w+":("(?:[^\\"]|\\.)*"|\S+),\s*)*
failregex = ^<lt_short/__prefix_line>{%(grp)s"msg":"Unsuccessful \S+ authentication attempt by user '<F-USER>(?:[^\\']|\\.)*</F-USER>'[^"]*",%(grp)s"remote_ip":"<ADDR>"
            ^<lt_short/__prefix_line>{%(grp)s"remote_ip":"<ADDR>",%(grp)s"msg":"Unsuccessful \S+ authentication attempt by user '<F-USER>(?:[^\\']|\\.)*</F-USER>'[^"]*"
