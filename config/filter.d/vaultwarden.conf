# Fail2Ban filter for unsuccessful Vaultwarden authentication attempts
#
# Vaultwarden log format (vaultwarden.log or journald):
#   [YYYY-MM-DD HH:MM:SS.mmm[+ZZZZ]][vaultwarden::api::<module>][ERROR] <msg> IP: <host>[. Username: <user>]
#
# Covers three failure events:
#   - Failed password login    (vaultwarden::api::identity)
#   - Invalid admin token      (vaultwarden::api::admin)
#   - Failed TOTP / 2FA code   (vaultwarden::api::core::two_factor::*)
#
# Author: LearningSpot

[Init]

# The timestamp is in the first [...] block; {DATE} is expanded to all
# built-in date patterns, anchored inside ^\[...\].
datepattern = ^\[{DATE}\]

[Definition]

failregex = ^\[vaultwarden::api::(?:identity|admin|core::two_factor(?:::\S+)?)\]\[ERROR\] (?:Username or password is incorrect[.!]|Invalid admin token[.!]|Invalid TOTP code[.!]).*\bIP:\s+<ADDR>

ignoreregex =

# DEV Notes:
# datepattern strips the leading [timestamp] block; failregex then sees the
# remainder starting with [module][LEVEL] message.
#
# The alternation inside the RE covers all three documented failure messages:
#   1. "Username or password is incorrect." (identity module)
#   2. "Invalid admin token[!]"             (admin module)
#   3. "Invalid TOTP code!"                 (core::two_factor::* module)
#
# Both [.!] endings and any trailing content (e.g. "Server time: … UTC")
# are handled by the lazy ".*" before the mandatory "\bIP:\s+" anchor.
# <ADDR> resolves to both IPv4 and IPv6 addresses.
