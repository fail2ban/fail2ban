# Fail2Ban filter for Cowrie SSH/Telnet honeypot (https://github.com/cowrie/cowrie)
# Detects new connections logged in Cowrie's JSON output format
# (log.format = json / output.jsonlog in cowrie.cfg), one JSON object per line, e.g.:
#   {"eventid": "cowrie.session.connect", "src_ip": "1.2.3.4", "src_port": 41000,
#    "dst_ip": "192.168.1.1", "dst_port": 2222, "session": "1a2b3c4d",
#    "protocol": "ssh", "message": "New connection: ...", "sensor": "myhost",
#    "timestamp": "2024-01-01T00:00:00.000000Z"}
# As Cowrie is a honeypot, any connection to it is unsolicited by definition.

[Init]

datepattern = "timestamp": "%%ExY-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?Z?"

[Definition]

failregex = ^\{"eventid": "cowrie\.session\.connect", "src_ip": "<ADDR>",\s*(?:"[^"]+":\s*(?:"[^"]*"|-?\d+(?:\.\d+)?),?\s*){0,12}\}$

ignoreregex =
