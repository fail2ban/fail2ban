[Definition]

# 1. Reset prefregex so Fail2ban passes the entire line to Python
prefregex = ^<F-CONTENT>.*</F-CONTENT>$

# 2. Syntax-valid regex containing <HOST> so Fail2ban's compiler doesn't throw an error
failregex = ^.*"src_ip"\s*:\s*"<HOST>".*$

# 3. Disable datepattern stripping so the JSON string arrives intact in Python
datepattern =