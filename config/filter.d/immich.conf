# Fail2Ban filter for Immich
#
# Detecting failed login attempts on Immich photo and video management solution
# (https://github.com/immich-app/immich)
#
# Supports both reverse proxy access logs (e.g. Nginx, Traefik, Apache)
# and Immich application server logs (NestJS / Docker / systemd-journal).
#

[INCLUDES]

before = common.conf

[Definition]

_daemon = immich.*

vhostpref = (?:[\w]+[\w\-\.]*\s+)?

failregex = ^%(vhostpref)s<ADDR> - [^"]*"[A-Z]+ /api/auth/login [^"]*" 401\s
            ^%(__prefix_line)s(?:\[Nest\]\s+\d+\s+-\s+)?(?:WARN\s+)?\[(?:Api:)?AuthService\] Failed login attempt for user <F-USER>\S+</F-USER> from ip address <ADDR>(?:\s|$)

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              ^\[Nest\] \d+ - %%m/%%d/%%ExY, %%I:%%M:%%S %%p
              {^LN-BEG}

journalmatch = _SYSTEMD_UNIT=immich-server.service + _COMM=immich-server
