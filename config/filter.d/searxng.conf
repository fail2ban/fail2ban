# Fail2Ban filter for SearXNG bot detection (https://github.com/searxng/searxng)
#
# Matches the client networks blocked by the limiter of SearXNG for too many
# suspicious requests (link_token method), e. g.:
#
#   2026-11-04 23:00:11,815 ERROR:searx.botdetection.ip_limit: BLOCK: too many request from 192.0.2.10/32 in SUSPICIOUS_IP_WINDOW (redirect to /)
#
# Notes:
#   - this message is only logged if the limiter uses the link_token method:
#     `server.limiter: true` in settings.yml (needs valkey) together with
#     `link_token = true` in section `[botdetection.ip_limit]` of limiter.toml,
#     or `server.public_instance: true` in settings.yml;
#   - all other rejections of the limiter (HTTP 429) are logged with level
#     DEBUG only, so they can't be matched here;
#   - SearXNG logs the client network (botdetection.ipv4_prefix / ipv6_prefix
#     in limiter.toml, default /32 and /48), so the whole network gets banned;
#   - behind a reverse proxy, this proxy must be listed in
#     botdetection.trusted_proxies, otherwise SearXNG logs (and fail2ban would
#     ban) the address of the proxy itself.
#
# Supported log types (option logtype):
#   file     - log written by uWSGI (/var/log/uwsgi/app/searxng.log) or stdout
#              of SearXNG redirected to a file (default)
#   short    - syslog-like file with prefix "host daemon[pid]: " before the
#              SearXNG timestamp
#   journal  - systemd-journal (set automatically for backend = systemd)

[INCLUDES]

before = common.conf

[Definition]

__prefix = <lt_<logtype>/__prefix>

failregex = ^<__prefix>ERROR:searx\.botdetection\.ip_limit: BLOCK: too many requests? from <SUBNET> in SUSPICIOUS_IP_WINDOW\b

ignoreregex =

datepattern = {^LN-BEG}

[lt_file]
__prefix = \s*

[lt_short]
# prefix "host daemon[pid]: " followed by the own timestamp of SearXNG:
__prefix = %(__prefix_line)s\d{4}-\d\d-\d\d \d\d:\d\d:\d\d,\d+\s+

[lt_journal]
__prefix = %(lt_short/__prefix)s
