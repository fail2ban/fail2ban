# Fail2Ban filter for Cowrie SSH/Telnet honeypot (https://github.com/cowrie/cowrie)
# Detects new connections logged in Cowrie's JSON output format
# (log.format = json / output.jsonlog in cowrie.cfg), one JSON object per line, e.g.:
#   {"session":"2a5e755afa79","protocol":"ssh","src_ip":"1.2.3.4","src_port":41000,
#    "dst_ip":"172.18.0.2","dst_port":2222,"eventid":"cowrie.session.connect",
#    "sensor":"myhost","uuid":"8c5b1af2-...","timestamp":"2024-01-01T00:00:00.000000Z",
#    "message":"New connection: ..."}
# As Cowrie is a honeypot, any connection to it is unsolicited by definition.

[Init]

datepattern = "timestamp":"(%%ExY-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?Z?)"

[Definition]

# bounded run of arbitrary "key":value pairs (string/number), used to skip
# over fields we don't care about without resorting to an unbounded ".*"
_kv = (?:\s*"(?!(?:src_ip|eventid)\b)\w[^"]+"\s*:\s*(?:"[^"]+"|\w+)\s*[,\}]){0,20}
datepattern = ^\{%(_kv)s("timestamp":"%%Y-%%m-%%dT%%H:%%M:%%S\.%%f%%z"\s*,\s*)
failregex = ^\{%(_kv)s"src_ip":"<ADDR>",%(_kv)s"eventid":"cowrie\.session\.connect"

ignoreregex =
